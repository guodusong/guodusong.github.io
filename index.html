// ── 生成激活码（内联表单）───────────────────
document.getElementById('addDeviceBtn')?.addEventListener('click', async () => {
  const label = document.getElementById('newDeviceLabel').value.trim();
  const expiresDays = parseInt(document.getElementById('newDeviceDays').value) || 30;
  const maxUses = parseInt(document.getElementById('newDeviceUses').value) || 300;
  const btn = document.getElementById('addDeviceBtn'); const orig = btn.textContent;
  btn.textContent = '生成中...'; btn.disabled = true;
  try {
    const data = await adminFetch('createActivation', { label, expires_days: expiresDays, max_uses: maxUses });
    if (data.ok) {
      document.getElementById('addDeviceMsg').innerHTML = `<span style="color:var(--success);">✅ 已生成: ${escapeHtml(data.code)} (${expiresDays}天/${maxUses}次)</span>`;
      document.getElementById('newDeviceLabel').value = '';
      document.getElementById('newDeviceDays').value = '30';
      document.getElementById('newDeviceUses').value = '300';
      if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(data.code); showToast(`已复制: ${data.code}`); }
      await loadActivations();
      setTimeout(() => { document.getElementById('addDeviceMsg').innerHTML = ''; }, 3000);
    } else {
      document.getElementById('addDeviceMsg').innerHTML = `<span style="color:var(--danger);">❌ ${escapeHtml(data.message||'失败')}</span>`;
    }
  } catch(e) { document.getElementById('addDeviceMsg').innerHTML = `<span style="color:var(--danger);">❌ ${escapeHtml(e.message)}</span>`; }
  finally { btn.textContent = orig; btn.disabled = false; }
});

// ── 搜索 ────────────────────────────────────
document.getElementById('deviceSearchBtn')?.addEventListener('click', () => {
  applyDeviceFilter();
});
document.getElementById('deviceSearchClearBtn')?.addEventListener('click', () => {
  document.getElementById('deviceSearchInput').value = '';
  state.deviceFilter = null;
  renderDeviceView();
});
function applyDeviceFilter() {
  const kw = (document.getElementById('deviceSearchInput').value || '').trim().toLowerCase();
  if (!kw) { state.deviceFilter = null; }
  else {
    state.deviceFilter = (a) => a.code.toLowerCase().includes(kw) || (a.label||'').toLowerCase().includes(kw);
  }
  state.deviceSelection = new Set();
  renderDeviceView();
}

// ── 加载 & 渲染 ─────────────────────────────
async function loadActivations() {
  const container = document.getElementById('activationTableContainer');
  if (!container) return;
  container.innerHTML = '<div class="empty">加载中...</div>';
  try {
    const data = await adminFetch('listActivations');
    state.activations = data.activations || [];
    state.deviceSelection = state.deviceSelection || new Set();
    renderDeviceView();
  } catch(e) {
    container.innerHTML = `<div class="empty" style="color:var(--danger);">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

function getStatusInfo(s) {
  const map = { unused:['未使用','var(--success)'], bound:['已绑定','var(--accent)'], revoked:['已暂停','var(--danger)'],
    expired:['已过期','var(--text-muted)'], exhausted:['次数用完','#f59e0b'] };
  return map[s] || [s||'未知','var(--text-secondary)'];
}

function renderDeviceView() {
  const container = document.getElementById('activationTableContainer');
  let items = state.activations || [];
  // 过滤
  if (state.deviceFilter) items = items.filter(state.deviceFilter);

  if (!items.length) {
    const msg = state.deviceFilter ? '无匹配结果' : '暂无激活码<br><span style="font-size:.78rem;">点击上方 [+ 生成激活码] 创建</span>';
    container.innerHTML = `<div class="empty"><span class="empty-icon">🔐</span>${msg}</div>`;
    return;
  }
  const isDesktop = window.innerWidth >= 768;
  if (isDesktop) {
    let h = '<div class="table-wrap"><table><thead><tr><th style="width:36px;"><input type="checkbox" id="selectAllDevices"></th><th>激活码</th><th>状态</th><th>备注</th><th>绑定设备</th><th>绑定时间</th><th>初始/剩余天数</th><th>初始/剩余次数</th><th>操作</th></tr></thead><tbody>';
    items.forEach(a => {
      const [stxt,scolor] = getStatusInfo(a.status);
      const dev = a.device ? a.device.substring(0,12)+'...' : '-';
      const bAt = a.bound_at ? new Date(a.bound_at).toLocaleString('zh-CN') : '-';
      const initDays = a.init_expires_days ?? a.expires_days;
      const initUses = a.init_max_uses ?? a.max_uses;
      const daysInfo = initDays === -1 ? '不限' : `${initDays} / ${Math.max(0, a.remaining_days)}`;
      const usesInfo = initUses === -1 ? '不限' : `${initUses} / ${Math.max(0, a.remaining_uses)}`;
      const checked = (state.deviceSelection||new Set()).has(a.code) ? 'checked' : '';
      h += `<tr data-code="${escapeHtml(a.code)}">
        <td><input type="checkbox" data-action="toggleDeviceSelect" data-code="${escapeHtml(a.code)}" ${checked}></td>
        <td class="token-name" data-action="copyCode" data-code="${escapeHtml(a.code)}">${escapeHtml(a.code)}</td>
        <td style="color:${scolor};font-weight:500;">${stxt}</td>
        <td>${escapeHtml(a.label||'-')}</td>
        <td style="font-family:monospace;font-size:.72rem;">${dev}</td>
        <td style="font-size:.76rem;">${bAt}</td>
        <td style="font-weight:500;">${daysInfo}</td>
        <td style="font-weight:500;">${usesInfo}</td>
        <td class="act-group">
          <button class="btn btn-xs" data-action="editDeviceDays" data-code="${escapeHtml(a.code)}">天数</button>
          <button class="btn btn-xs" data-action="editDeviceUses" data-code="${escapeHtml(a.code)}">次数</button>
          ${a.status==='revoked'
            ?`<button class="btn btn-xs" data-action="restoreActivation" data-code="${escapeHtml(a.code)}">恢复</button>`
            :`<button class="btn btn-xs btn-danger" data-action="revokeActivation" data-code="${escapeHtml(a.code)}">暂停</button>`}
          <button class="btn btn-xs btn-danger" data-action="deleteActivation" data-code="${escapeHtml(a.code)}">删除</button></td>
      </tr>`;
    });
    h += '</tbody></table></div>';
    container.innerHTML = h;
    // 全选框事件
    const checkAll = document.getElementById('selectAllDevices');
    if (checkAll) checkAll.addEventListener('change', e => {
      items.forEach(a => {
        if (e.target.checked) (state.deviceSelection||new Set()).add(a.code);
        else (state.deviceSelection||new Set()).delete(a.code);
      });
      renderDeviceView();
    });
  } else {
    let h = '<div class="token-list">';
    items.forEach(a => {
      const [stxt,scolor] = getStatusInfo(a.status);
      const dev = a.device ? a.device.substring(0,12)+'...' : '-';
      const bAt = a.bound_at ? new Date(a.bound_at).toLocaleString('zh-CN') : '-';
      const initDays = a.init_expires_days ?? a.expires_days;
      const initUses = a.init_max_uses ?? a.max_uses;
      const daysInfo = initDays === -1 ? '不限' : `${initDays} / ${Math.max(0, a.remaining_days)}`;
      const usesInfo = initUses === -1 ? '不限' : `${initUses} / ${Math.max(0, a.remaining_uses)}`;
      const checked = (state.deviceSelection||new Set()).has(a.code) ? 'selected' : '';
      h += `<div class="token-card ${checked}" data-code="${escapeHtml(a.code)}">
        <div class="token-card-top">
          <div class="token-card-info">
            <div class="token-card-name" data-action="copyCode" data-code="${escapeHtml(a.code)}">${escapeHtml(a.code)}</div>
            <div style="font-size:.72rem;color:${scolor};font-weight:500;margin-top:4px;">${stxt} · 备注: ${escapeHtml(a.label||'无')}</div>
          </div>
          <input type="checkbox" data-action="toggleDeviceSelect" data-code="${escapeHtml(a.code)}" ${checked?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;">
        </div>
        <div style="font-size:.76rem;margin-top:6px;">设备: ${dev} | 绑定: ${bAt}</div>
        <div style="font-size:.76rem;margin-top:2px;">天数: ${daysInfo} | 次数: ${usesInfo}</div>
        <div class="token-card-acts">
          <button class="btn btn-xs" data-action="editDeviceDays" data-code="${escapeHtml(a.code)}">天数</button>
          <button class="btn btn-xs" data-action="editDeviceUses" data-code="${escapeHtml(a.code)}">次数</button>
          ${a.status==='revoked'
            ?`<button class="btn btn-xs" data-action="restoreActivation" data-code="${escapeHtml(a.code)}">恢复</button>`
            :`<button class="btn btn-xs btn-danger" data-action="revokeActivation" data-code="${escapeHtml(a.code)}">暂停</button>`}
          <button class="btn btn-xs btn-danger" data-action="deleteActivation" data-code="${escapeHtml(a.code)}">删除</button>
        </div>
      </div>`;
    });
    h += '</div>';
    container.innerHTML = h;
  }
}

// ── 事件代理 ─────────────────────────────────
document.getElementById('activationTableContainer')?.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, code } = btn.dataset;
  const sel = state.deviceSelection || new Set();

  if (action === 'copyCode') {
    if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(code); showToast(`已复制: ${code}`); }
  }
  if (action === 'toggleDeviceSelect') {
    if (sel.has(code)) sel.delete(code); else sel.add(code);
    renderDeviceView();
  }
  if (action === 'editDeviceDays') {
    const act = (state.activations||[]).find(a => a.code === code);
    const cur = act ? (act.expires_days === -1 ? '不限' : act.expires_days) : '?';
    const val = prompt('当前天数: ' + cur + '\n新值（0=到期, -1=不限）：');
    if (val === null) return;
    const n = parseInt(val);
    if (isNaN(n) || n < -1) { showToast('请输入有效数字(-1/0/正整数)', true); return; }
    try { await adminFetch('updateActivationDays', { code, expires_days: n }); showToast('已更新'); await loadActivations(); }
    catch(e) { showToast(`失败: ${e.message}`, true); }
  }
  if (action === 'editDeviceUses') {
    const act = (state.activations||[]).find(a => a.code === code);
    const cur = act ? (act.max_uses === -1 ? '不限' : act.max_uses) : '?';
    const val = prompt('当前次数: ' + cur + '\n新值（0=用完, -1=不限）：');
    if (val === null) return;
    const n = parseInt(val);
    if (isNaN(n) || n < -1) { showToast('请输入有效数字(-1/0/正整数)', true); return; }
    try { await adminFetch('updateActivationUses', { code, max_uses: n }); showToast('已更新'); await loadActivations(); }
    catch(e) { showToast(`失败: ${e.message}`, true); }
  }
  if (action === 'revokeActivation') {
    const ok = await showConfirm('暂停激活码', `确定要暂停 "${code}" 吗？`);
    if (!ok) return;
    try { await adminFetch('revokeActivation', { code }); showToast('已暂停'); await loadActivations(); }
    catch(e) { showToast(`失败: ${e.message}`, true); }
  }
  if (action === 'restoreActivation') {
    try { await adminFetch('restoreActivation', { code }); showToast('已恢复'); await loadActivations(); }
    catch(e) { showToast(`失败: ${e.message}`, true); }
  }
  if (action === 'deleteActivation') {
    const ok = await showConfirm('删除激活码', `确定要彻底删除 "${code}" 吗？`);
    if (!ok) return;
    try { await adminFetch('deleteActivation', { code }); showToast('已删除'); await loadActivations(); }
    catch(e) { showToast(`失败: ${e.message}`, true); }
  }
});

// ── 批量操作 ─────────────────────────────────
document.getElementById('deleteDeviceSelectedBtn')?.addEventListener('click', async () => {
  const sel = state.deviceSelection || new Set();
  if (!sel.size) { showToast('未选中任何激活码', true); return; }
  const ok = await showConfirm('批量删除', `确定删除选中的 ${sel.size} 个激活码吗？`);

  try {
    await adminFetch('deleteActivationsBatch', { codes: JSON.stringify(Array.from(sel)) });
